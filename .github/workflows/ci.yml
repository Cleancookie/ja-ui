name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the generated CSS is up to date
        run: |
          npm run gen
          git diff --exit-code src/styles/generated \
            || (echo "::error::src/styles/generated is stale — run 'npm run gen' and commit."; exit 1)
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Smoke test the components in a real browser
        run: npm run smoke
      - run: npm run build-storybook
      - name: Assemble the Pages site
        run: node tools/build-site.mjs
