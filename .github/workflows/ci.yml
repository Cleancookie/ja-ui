name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Smoke test the components in a real browser
        run: npm run smoke
      - name: Drive the example pages in a real browser
        run: npm run check:examples
      - name: Check every token pair against WCAG AA
        run: npm run check:contrast
      - run: npm run build-storybook
