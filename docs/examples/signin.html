<!doctype html>
<html lang="en" data-ja-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · ja-ui</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="../dist/ja-ui.css" />
    <script src="../dist/ja-ui.iife.js" defer></script>
  </head>
  <body class="pattern-grid">
    <main class="container d-flex align-items-center justify-content-center" style="min-block-size: 100dvh">
      <div class="position-relative" style="inline-size: 100%; max-inline-size: 26rem">
        <div class="shape shape-circle bg-pop" style="inline-size: 9rem; block-size: 9rem; inset-block-start: -3rem; inset-inline-start: -3rem"></div>
        <div class="shape shape-square bg-fresh rotate-6" style="inline-size: 6rem; block-size: 6rem; inset-block-end: -2rem; inset-inline-end: -2rem"></div>

        <form class="card shadow-xl position-relative">
          <div class="card-body p-5 gap-4">
            <div class="d-flex flex-column align-items-center gap-3 text-center">
              <span class="navbar-brand">ja&nbsp;ui</span>
              <h1 class="h3">Welcome back</h1>
              <p class="text-muted">Sign in to the internal tools console.</p>
            </div>

            <div class="form-group">
              <label class="form-label" for="si-email">Email</label>
              <input type="email" class="form-control" id="si-email" placeholder="you@company.com" autocomplete="username" required />
            </div>

            <div class="form-group">
              <div class="d-flex justify-content-between align-items-center">
                <label class="form-label" for="si-password">Password</label>
                <a href="#" class="fs-sm">Forgot?</a>
              </div>
              <input type="password" class="form-control" id="si-password" autocomplete="current-password" required />
            </div>

            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="si-remember" checked />
              <label class="form-check-label" for="si-remember">Keep me signed in</label>
            </div>

            <button class="btn btn-primary btn-lg btn-block" type="submit">Sign in</button>

            <div class="d-flex align-items-center gap-3">
              <hr class="flex-grow-1" />
              <span class="text-label text-muted">or</span>
              <hr class="flex-grow-1" />
            </div>

            <div class="d-flex flex-column gap-2">
              <button class="btn btn-outline-secondary btn-block" type="button">Continue with SSO</button>
              <button class="btn btn-outline-secondary btn-block" type="button">Continue with GitHub</button>
            </div>
          </div>
          <div class="card-footer justify-content-center">
            <span class="text-muted">No account? <a href="#" class="fw-bold">Request access</a></span>
          </div>
        </form>
      </div>
    </main>
  </body>
</html>
